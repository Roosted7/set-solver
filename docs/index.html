<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SET! — on-device solver</title>
<style>
  :root { --bg:#000; --fg:#f2f2f2; --dim:#9a9a9a; --accent:#ffd400; --panel:rgba(20,20,20,.82); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #video, #still, #overlay { position:absolute; inset:0; width:100%; height:100%; }
  #video { object-fit:contain; background:#000; }
  #still { display:none; }
  #overlay { pointer-events:none; }

  #top { position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
    display:flex; gap:10px; align-items:center; background:linear-gradient(#000c,#0000); z-index:5; }
  #status { flex:1; font-weight:600; font-size:16px; }
  #stats { color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; text-align:right; }

  #banner { position:fixed; left:50%; top:22%; transform:translate(-50%,-50%) scale(.6); opacity:0;
    font-size:72px; font-weight:900; letter-spacing:2px; color:var(--accent);
    text-shadow:0 4px 24px #000, 0 0 2px #000; transition:all .18s ease-out; z-index:6; pointer-events:none; }
  #banner.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

  #bottom { position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(#0000,#000d 40%); display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:10px; align-items:center; justify-content:center; }
  button, select { font:inherit; color:var(--fg); background:var(--panel); border:1px solid #ffffff2a;
    border-radius:999px; padding:10px 16px; min-height:44px; }
  button:active { transform:scale(.97); }
  button.on { background:var(--accent); color:#000; border-color:var(--accent); }
  #startBtn { min-width:120px; font-weight:700; font-size:17px; }
  #startBtn.running { background:#d33; border-color:#d33; }
  .lens { display:flex; gap:6px; }
  .lens button { padding:8px 12px; min-width:52px; }
  #zoomRow { display:none; color:var(--dim); font-size:13px; }
  #zoomRow input { flex:1; max-width:360px; accent-color:var(--accent); }
  #zoomVal { min-width:40px; text-align:right; font-variant-numeric:tabular-nums; }

  #settings { position:fixed; right:12px; left:12px; bottom:calc(env(safe-area-inset-bottom) + 130px); z-index:7;
    background:#161616f2; border:1px solid #ffffff22; border-radius:16px; padding:14px 16px; display:none;
    max-width:460px; margin:0 auto; }
  #settings.open { display:block; }
  #settings h3 { margin:0 0 10px; font-size:15px; }
  #settings label { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:7px 0;
    border-bottom:1px solid #ffffff12; }
  #settings label:last-of-type { border-bottom:0; }
  #settings select, #settings input[type=file] { max-width:58%; }
  #settings select { padding:6px 10px; min-height:34px; }
  #settings .hint { color:var(--dim); font-size:12px; margin-top:8px; }

  #intro { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; text-align:center; background:#000; }
  #intro h1 { margin:0; font-size:44px; letter-spacing:2px; color:var(--accent); }
  #intro p { margin:0; color:var(--dim); max-width:420px; }
  #intro button { font-size:18px; padding:14px 28px; background:var(--accent); color:#000; font-weight:700; border:0; }
  #intro .small { font-size:13px; }
  #err { color:#ff6b6b; white-space:pre-wrap; max-width:520px; }
</style>
</head>
<body>
<div id="intro">
  <h1>SET!</h1>
  <p>Point the phone at the table. Everything runs on this device. When all cards are down, it calls out a set and outlines it.</p>
  <button id="introBtn">Start camera</button>
  <p class="small" id="loadMsg">Loading models…</p>
  <p class="small"><a href="#" id="introPhoto" style="color:var(--dim)">or try it on a photo</a></p>
  <div id="err"></div>
</div>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="still"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div id="top">
  <div id="status">Ready</div>
  <div id="stats"></div>
</div>
<div id="banner">SET!</div>

<div id="settings">
  <h3>Settings</h3>
  <label>Call a set once there are
    <select id="minCards">
      <option value="3">any 3+ cards</option>
      <option value="9">9+ cards</option>
      <option value="12" selected>12+ cards</option>
      <option value="15">15+ cards</option>
    </select></label>
  <label>Detector resolution
    <select id="detSize">
      <option value="480" selected>480 (faster)</option>
      <option value="640">640 (small/far cards)</option>
    </select></label>
  <label>Show card labels
    <select id="showLabels"><option value="1" selected>on</option><option value="0">off</option></select></label>
  <label>Sound
    <select id="soundMode"><option value="voice" selected>voice “Set!”</option><option value="beep">beep</option><option value="file">my recording…</option><option value="off">off</option></select></label>
  <label id="soundFileRow" style="display:none">Recording file <input type="file" id="soundFile" accept="audio/*"></label>
  <label>Camera <select id="camSelect"></select></label>
  <label>Test on a photo <input type="file" id="photoFile" accept="image/*"></label>
  <div class="hint" id="backendInfo"></div>
</div>

<div id="bottom">
  <div class="row" id="zoomRow"><span>zoom</span><input type="range" id="zoom"><span id="zoomVal"></span></div>
  <div class="row">
    <div class="lens" id="lensButtons"></div>
  </div>
  <div class="row">
    <button id="torchBtn" style="display:none">🔦 Flash</button>
    <button id="startBtn">Start</button>
    <button id="gearBtn">⚙︎</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
